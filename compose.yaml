name: rabbitmq-servicebus-java-demo
services:
  rabbitmq:
    image: rabbitmq:4.1-management
    hostname: migration-rabbit
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbit-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 24
volumes:
  rabbit-data:
